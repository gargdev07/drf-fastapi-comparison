services:
  # 1. FastAPI Backend API
  - type: web
    name: fastapi-comparison-api
    runtime: python
    region: oregon
    plan: free
    rootDir: backend/fastapi_app
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: FASTAPI_DB_PATH
        value: /tmp/products.sqlite3
      - key: CORS_ALLOWED_ORIGINS
        value: "*"

  # 2. Django REST Framework Backend API
  - type: web
    name: drf-comparison-api
    runtime: python
    region: oregon
    plan: free
    rootDir: backend/drf_app
    buildCommand: pip install -r requirements.txt && python manage.py migrate
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DJANGO_DEBUG
        value: "True"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: "*"
      - key: DRF_DB_PATH
        value: /tmp/products.sqlite3
      - key: CORS_ALLOWED_ORIGINS
        value: "*"

  # 3. React Frontend (Static Site)
  - type: web
    name: api-forge-frontend
    runtime: static
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: 20.19.0
      - key: VITE_FASTAPI_URL
        fromService:
          type: web
          name: fastapi-comparison-api
          property: host
      - key: VITE_DRF_URL
        fromService:
          type: web
          name: drf-comparison-api
          property: host
